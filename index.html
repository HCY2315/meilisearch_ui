

<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多维查询系统</title>
    <style>
        :root {
            --primary-color: #0f766e;
            --primary-dark: #0b5f58;
            --secondary-color: #0ea5a4;
            --success-color: #16a34a;
            --warning-color: #d97706;
            --error-color: #dc2626;
            --background: #f7f8fb;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --app-gradient: linear-gradient(180deg, #f8fafc 0%, #eef2f7 55%, #f8fafc 100%);
            --overlay: rgba(255, 255, 255, 0.8);
            --highlight-bg: #fef3c7;
            --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.06);
            --shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.12), 0 1px 2px -1px rgba(15, 23, 42, 0.12);
            --shadow-lg: 0 12px 18px -6px rgba(15, 23, 42, 0.16), 0 6px 10px -4px rgba(15, 23, 42, 0.08);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --primary-color: #22c1b9;
            --primary-dark: #129a92;
            --secondary-color: #36d6cc;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --error-color: #f87171;
            --background: #0f1724;
            --surface: #111c2b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-color: #1f2a3a;
            --app-gradient: radial-gradient(circle at top, #142136 0%, #0b121c 55%, #070c13 100%);
            --overlay: rgba(7, 12, 19, 0.7);
            --highlight-bg: #1f2a1b;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
            --shadow: 0 2px 6px 0 rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 20px 24px -10px rgba(0, 0, 0, 0.5), 0 10px 14px -10px rgba(0, 0, 0, 0.4);
            color-scheme: dark;
        }

        [data-theme="light"] {
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Source Sans 3", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--app-gradient);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1800px;
            width: min(1800px, 100% - 48px);
            margin: 0 auto;
            padding: clamp(16px, 2vw, 28px);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 32px;
            border-radius: var(--radius);
            margin-bottom: 32px;
            box-shadow: var(--shadow-lg);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 2rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.2);
        }

        /* Connection Panel */
        .connection-panel {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-control {
            padding: 10px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: var(--transition);
            background: var(--surface);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 6px rgba(99, 102, 241, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--background);
        }

        /* Search Area */
        .search-section {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 28px;
            margin-bottom: 24px;
        }

        .search-panel {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 16px 88px 16px 48px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .ai-badge {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: var(--background);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            transition: var(--transition);
            cursor: pointer;
            user-select: none;
        }

        .ai-badge.active {
            background: linear-gradient(135deg, #22c1b9, #36d6cc);
            color: #0b1b1c;
            border-color: transparent;
            box-shadow: 0 6px 10px rgba(34, 193, 185, 0.25);
        }

        .ai-dropdown {
            position: absolute;
            right: 16px;
            top: calc(50% + 18px);
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            padding: 14px 16px;
            min-width: 240px;
            z-index: 5;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: var(--transition);
        }

        .ai-dropdown.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .ai-dropdown .dropdown-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .ai-dropdown .dropdown-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .ai-dropdown input[type="range"] {
            width: 100%;
        }

        .ai-weight-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .ai-weight-hint {
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Query Builder */
        .query-builder {
            background: var(--background);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .query-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            align-items: flex-end;
        }

        .query-field {
            flex: 1;
            min-width: 0;
        }

        .query-operator {
            width: 100px;
        }

        .query-value {
            flex: 2;
            min-width: 0;
        }

        .query-logic {
            width: 80px;
        }

        .query-actions {
            display: flex;
            gap: 8px;
        }

        .query-actions .btn {
            padding: 8px 16px;
            font-size: 0.875rem;
        }

        .remove-btn {
            background: var(--error-color);
            color: white;
        }

        /* Filters Drawer */
        .filters-drawer {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 1002;
        }

        .filters-drawer.active {
            opacity: 1;
            visibility: visible;
        }

        .filters-drawer-content {
            position: absolute;
            top: 0;
            right: 0;
            width: min(420px, 92vw);
            height: 100%;
            background: var(--surface);
            box-shadow: var(--shadow-lg);
            transform: translateX(100%);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .filters-drawer.active .filters-drawer-content {
            transform: translateX(0);
        }

        .filters-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .filters-drawer-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .filters-sidebar {
            background: transparent;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            max-height: none;
            overflow: visible;
            position: static;
        }

        .filter-section {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .filter-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .filter-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .filter-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .filter-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
        }

        .filter-item input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--primary-color);
        }

        .filter-label {
            flex: 1;
        }

        .filter-count {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Results Area */
        .results-panel {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .results-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .results-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .results-count {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .results-count strong {
            color: var(--text-primary);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .result-card {
            background: var(--background);
            border-radius: 10px;
            padding: 20px;
            transition: var(--transition);
            cursor: pointer;
            border: 2px solid transparent;
        }

        .result-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }

        .sortable-th {
            cursor: grab;
            user-select: none;
        }

        .sortable-th:active {
            cursor: grabbing;
        }

        .sortable-th.drag-over {
            outline: 2px dashed var(--primary-color);
            outline-offset: -4px;
        }

        .column-config-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }

        .column-config-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--background);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 16px;
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .result-description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .result-tag {
            padding: 4px 10px;
            background: var(--surface);
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .highlight {
            background: var(--highlight-bg);
            padding: 2px 4px;
            border-radius: 3px;
            color: var(--text-primary);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .pagination-btn {
            padding: 8px 16px;
            border-radius: 6px;
            background: var(--surface);
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }

        .pagination-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background: var(--background);
        }

        .pagination-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* History & Suggestions */
        .history-panel, .suggestions-panel {
            margin-top: 20px;
        }

        .history-list, .suggestions-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item, .suggestion-item {
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-item:hover, .suggestion-item:hover {
            background: var(--background);
        }

        .history-time {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .clear-history {
            margin-top: 12px;
            color: var(--error-color);
            cursor: pointer;
            font-size: 0.875rem;
            transition: var(--transition);
        }

        .clear-history:hover {
            text-decoration: underline;
        }

        /* Advanced Settings */
        .advanced-settings {
            background: var(--background);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: var(--primary-color);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
        }

        .toast {
            background: var(--surface);
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            border-left: 4px solid var(--success-color);
        }

        .toast.error {
            border-left: 4px solid var(--error-color);
        }

        .toast.warning {
            border-left: 4px solid var(--warning-color);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .search-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header {
                padding: 24px;
            }

            .header-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .query-row {
                flex-direction: column;
            }

            .query-field,
            .query-operator,
            .query-value,
            .query-logic {
                width: 100%;
            }

            .field-controls {
                grid-template-columns: repeat(2, minmax(160px, 1fr));
                min-width: 0;
            }
        }

        /* Loading State */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1001;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 32px;
            max-width: 1100px;
            width: min(1100px, 95vw);
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .field-config {
            margin-bottom: 16px;
            padding: 16px;
            background: var(--background);
            border-radius: 8px;
            overflow-x: auto;
        }

        .field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .field-controls {
            display: grid;
            grid-template-columns: minmax(140px, 1.1fr) minmax(180px, 1.4fr) minmax(90px, 0.6fr) minmax(90px, 0.6fr);
            gap: 12px;
            align-items: end;
            min-width: 720px;
        }

        .field-controls .form-group {
            min-width: 0;
        }

        .field-controls .inline-check {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .field-controls .inline-check input {
            margin: 0;
        }
    </style>
        <style>
            .results-table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
            }
            .results-table th, .results-table td {
                border: 1px solid var(--border-color);
                padding: 8px 10px;
                text-align: left;
                word-break: break-word;
            }
            .results-table tbody tr:hover {
                background: var(--background);
                cursor: pointer;
            }
            .results-table-wrap {
                width: 100%;
                grid-column: 1 / -1;
                overflow-x: auto;
            }
        </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <h1>🔍  多维查询系统</h1>
                <button class="theme-toggle" id="themeToggle" type="button">🌙 夜间模式</button>
            </div>
            <p>强大的多维度搜索与过滤功能，快速定位您需要的内容</p>
        </header>

    <script>
        // 兼容旧代码或缓存：确保全局 `meilisearch` 可用（有些示例使用小写命名）
        (function(){

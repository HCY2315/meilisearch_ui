services:
  meilisearch-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: meilisearch-ui:latest
    environment:
      - SMTP_USER=13832286642@163.com
      - SMTP_PASS=DVbwcgpFwBmzuX3X
    ports:
      - "7701:8080"
    volumes:
      # 将容器内的 data 目录挂载到宿主机的 ./data 目录下
      # 这样数据库文件会保存在宿主机的 ./data/meili_admin.db
      - ./backend:/app/backend/data
    restart: always


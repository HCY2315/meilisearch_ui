[package]
name = "meilisearch_ui"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Node",
    "Storage",
    "EventTarget",
    "DomTokenList",
    "DomRect",
    "DragEvent",
    "MouseEvent",
] }
gloo-net = { version = "0.5", features = ["http", "json"] }
gloo-timers = "0.3"
gloo-events = "0.2"
